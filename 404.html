<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111b;
        --surface: #0d1724;
        --border: #1a2838;
        --text: #edf2f7;
        --muted: #96a5b8;
        --accent: #74b9ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top right, rgba(116, 185, 255, 0.08), transparent 24%),
          linear-gradient(180deg, #07111a 0%, #08131f 52%, #06111b 100%);
        color: var(--text);
        font-family: Manrope, system-ui, sans-serif;
      }

      main {
        width: min(640px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 12px 16px;
        background: var(--text);
        color: #07111c;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The requested page does not exist. Return to the homepage.</p>
      <a href="./index.html">Back to site</a>
    </main>
  </body>
</html>
